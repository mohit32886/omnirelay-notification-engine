services:
  redis:
    image: redis:7.2-alpine
    container_name: omnirelay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: omnirelay-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  vault:
    image: hashicorp/vault:1.15
    container_name: omnirelay-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: omnirelay-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  mock-upstreams:
    image: python:3.11-slim
    container_name: omnirelay-mock-upstreams
    volumes:
      - ./gameday/mock_upstreams.py:/app/mock_upstreams.py:ro
    command: ["python3", "/app/mock_upstreams.py", "--port", "8090"]
    ports:
      - "8090:8090"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: omnirelay-toxiproxy
    ports:
      - "8474:8474"
      - "18081:18081"
      - "18082:18082"
    depends_on:
      - mock-upstreams

  toxiproxy-init:
    image: curlimages/curl:8.7.1
    container_name: omnirelay-toxiproxy-init
    depends_on:
      - toxiproxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 2
        curl -sS -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json' -d '{"name":"sendgrid_upstream","listen":"0.0.0.0:18081","upstream":"mock-upstreams:8090","enabled":true}' || true
        curl -sS -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json' -d '{"name":"ses_upstream","listen":"0.0.0.0:18082","upstream":"mock-upstreams:8090","enabled":true}' || true

  omnirelay-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnirelay-engine
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: omnirelay-dev-root-token
      SENDGRID_US_EAST_URL: http://toxiproxy:18081
      SENDGRID_EU_URL: http://toxiproxy:18081
      SENDGRID_AP_NORTHEAST_URL: http://toxiproxy:18081
      SENDGRID_US_GOV_URL: http://toxiproxy:18081
      SES_US_EAST_URL: http://toxiproxy:18082
      SES_EU_URL: http://toxiproxy:18082
      SES_AP_NORTHEAST_URL: http://toxiproxy:18082
      SES_US_GOV_URL: http://toxiproxy:18082
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      vault:
        condition: service_started
      toxiproxy-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: omnirelay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./gameday/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - omnirelay-engine

  grafana:
    image: grafana/grafana:10.4.2
    container_name: omnirelay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: omnirelay
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./gameday/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./gameday/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
